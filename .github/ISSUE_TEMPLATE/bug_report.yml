name: Bug Report
description: File a bug report or reproducible defect in EvidenceOS
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide detailed context to help reproduce and resolve the problem.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the defect encountered...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide reproduction steps or minimal code example.
      placeholder: |
        1. Ingest case with payload '...'
        2. Execute decision engine...
        3. See unexpected behavior...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, EvidenceOS version.
      placeholder: "e.g., Python 3.12, Windows 11, EvidenceOS v1.1.1"
    validations:
      required: false
