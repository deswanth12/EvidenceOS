version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: evidenceos-db
    environment:
      POSTGRES_USER: evidenceos
      POSTGRES_PASSWORD: evidenceos_dev_password
      POSTGRES_DB: evidenceos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidenceos"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: evidenceos-api
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://evidenceos:evidenceos_dev_password@db:5432/evidenceos
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/data/evidence_store
      AI_PROVIDER: ${AI_PROVIDER:-heuristic_local}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - evidence_data:/app/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: evidenceos-web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  evidence_data:
